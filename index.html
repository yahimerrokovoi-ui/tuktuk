<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker | Новые & Поверка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #09090b; 
            color: #f4f4f5; 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        .bento-card { 
            background: rgba(24, 24, 27, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        
        .input-glow-blue:focus-within { box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); }
        .input-glow-rose:focus-within { box-shadow: 0 0 20px rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.4); }
    </style>
</head>
<body class="p-4 md:p-8 selection:bg-blue-500/30">
    <div class="max-w-2xl mx-auto">
        <div id="sync-status" class="h-4 mb-4 text-[10px] font-bold uppercase tracking-[0.2em] text-center text-zinc-500 transition-opacity duration-300 opacity-0 pointer-events-none">
            Синхронизация...
        </div>

        <!-- Tabs Navigation -->
        <div class="flex justify-center gap-2 mb-8 relative z-20">
            <button id="tab-btn-dash" onclick="setTab('dash')" class="px-6 py-2.5 rounded-full bg-zinc-800 text-white text-[10px] font-bold uppercase tracking-widest transition-all shadow-md">Дашборд</button>
            <button id="tab-btn-cal" onclick="setTab('cal')" class="px-6 py-2.5 rounded-full bg-transparent border border-zinc-800/60 text-zinc-500 hover:text-white hover:bg-zinc-800/30 text-[10px] font-bold uppercase tracking-widest transition-all">Календарь</button>
        </div>

        <!-- Header Controls (Visible across both views) -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8 relative z-10">
            <div class="flex items-center gap-4 mx-auto md:mx-0">
                <button onclick="changeDay(-1)" class="w-10 h-10 flex items-center justify-center rounded-xl bg-zinc-800/40 border border-zinc-700/50 hover:bg-zinc-700/80 hover:border-zinc-500 text-zinc-400 hover:text-white transition-all cursor-pointer shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="text-center min-w-[150px]">
                    <p onclick="goToToday()" class="text-zinc-500 text-[10px] uppercase tracking-widest font-semibold cursor-pointer hover:text-zinc-300 transition-colors">Отчет за</p>
                    <h1 id="current-date-title" class="text-xl font-bold text-white whitespace-nowrap tracking-tight">...</h1>
                </div>
                <button onclick="changeDay(1)" class="w-10 h-10 flex items-center justify-center rounded-xl bg-zinc-800/40 border border-zinc-700/50 hover:bg-zinc-700/80 hover:border-zinc-500 text-zinc-400 hover:text-white transition-all cursor-pointer shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
            
            <div id="dash-balances" class="flex gap-3 w-full md:w-auto transition-opacity duration-300">
                <div class="flex-1 md:flex-none text-right bg-zinc-900/50 px-5 py-3 rounded-2xl border border-zinc-800/80 relative overflow-hidden">
                    <div class="absolute inset-0 bg-blue-500/5"></div>
                    <div class="text-[10px] uppercase tracking-widest text-zinc-400 font-semibold relative z-10">Новые</div>
                    <div id="total-in" class="text-3xl font-black text-white relative z-10 tracking-tighter">0 <span class="text-sm font-medium text-zinc-500">шт.</span></div>
                </div>
                <div class="flex-1 md:flex-none text-right bg-zinc-900/50 px-5 py-3 rounded-2xl border border-zinc-800/80 relative overflow-hidden">
                    <div class="absolute inset-0 bg-rose-500/5"></div>
                    <div class="text-[10px] uppercase tracking-widest text-zinc-400 font-semibold relative z-10">Поверка</div>
                    <div id="total-out" class="text-3xl font-black text-white relative z-10 tracking-tighter">0 <span class="text-sm font-medium text-zinc-500">шт.</span></div>
                </div>
            </div>
        </div>

        <!-- ======================= -->
        <!-- VIEW 1: DASHBOARD       -->
        <!-- ======================= -->
        <div id="view-dash">
            <!-- Input (Новые) -->
            <div class="bento-card p-2 pl-6 mb-5 flex gap-4 relative z-20 items-center input-glow-blue transition-all border border-zinc-800">
                <input type="number" id="qty-in" placeholder="Сколько новых?" 
                    class="bg-transparent w-full outline-none text-white text-lg font-medium placeholder:text-zinc-600">
                <button id="btn-in" class="w-[140px] bg-white text-black hover:bg-zinc-200 py-4 rounded-xl font-bold cursor-pointer transition-colors whitespace-nowrap shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                    Добавить
                </button>
            </div>

            <!-- Input (Поверка) -->
            <div class="bento-card p-2 pl-6 mb-10 flex gap-4 relative z-20 items-center input-glow-rose transition-all border border-zinc-800">
                <input type="number" id="qty-out" placeholder="Сколько на поверку?" 
                    class="bg-transparent w-full outline-none text-white text-lg font-medium placeholder:text-zinc-600">
                <button id="btn-out" class="w-[140px] bg-zinc-800 text-white border border-zinc-700 hover:bg-zinc-700 py-4 rounded-xl font-bold cursor-pointer transition-colors whitespace-nowrap">
                    Списать
                </button>
            </div>

            <!-- Chart Carousel -->
            <div class="bento-card p-6 mb-6 relative z-10">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="chart-title-text" class="text-zinc-400 uppercase text-[10px] font-bold tracking-[0.2em]">Активность за день (часы)</h3>
                    <div class="flex gap-2">
                        <button onclick="changeChart(-1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-800/40 border border-zinc-700/50 hover:bg-zinc-700/80 hover:border-zinc-500 text-zinc-400 hover:text-white transition-all cursor-pointer shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button onclick="changeChart(1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-800/40 border border-zinc-700/50 hover:bg-zinc-700/80 hover:border-zinc-500 text-zinc-400 hover:text-white transition-all cursor-pointer shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>
                
                <div class="relative h-[250px] md:h-[300px] w-full flex justify-center">
                    <canvas id="activityChart1" class="absolute inset-0 w-full h-full transition-opacity duration-300 z-10 opacity-100"></canvas>
                    <canvas id="activityChart2" class="absolute inset-0 w-full h-full transition-opacity duration-300 z-0 opacity-0 pointer-events-none"></canvas>
                    <canvas id="activityChart3" class="absolute inset-0 w-full h-full transition-opacity duration-300 z-0 opacity-0 pointer-events-none"></canvas>
                </div>

                <!-- Dots -->
                <div class="flex justify-center gap-2 mt-4">
                    <div id="dot0" class="w-2 h-2 rounded-full bg-blue-500 transition-colors"></div>
                    <div id="dot1" class="w-2 h-2 rounded-full bg-zinc-700 transition-colors"></div>
                    <div id="dot2" class="w-2 h-2 rounded-full bg-zinc-700 transition-colors"></div>
                </div>
            </div>

            <!-- Log -->
            <div class="bento-card p-6 mb-8 relative z-10">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-zinc-400 uppercase text-[10px] font-bold tracking-[0.2em]">История операций</h3>
                    <button onclick="downloadCSV()" class="text-[10px] uppercase font-bold tracking-widest text-zinc-500 hover:text-white cursor-pointer transition-colors bg-zinc-800/50 px-3 py-1.5 rounded-md border border-zinc-700/50">Export CSV</button>
                </div>
                <div id="log" class="space-y-3 max-h-64 overflow-y-auto pr-3"></div>
            </div>

            <div class="text-center pb-8">
                <button onclick="clearDay()" class="text-zinc-600 text-[10px] uppercase font-bold tracking-widest hover:text-rose-500 cursor-pointer transition-colors">Очистить историю за этот день</button>
            </div>
        </div>

        <!-- ======================= -->
        <!-- VIEW 2: CALENDAR        -->
        <!-- ======================= -->
        <div id="view-cal" class="hidden">
            <div class="bento-card p-4 md:p-6 mb-8 relative z-10">
                <div class="text-center mb-6">
                    <h3 id="calendar-month-title" class="text-white text-lg font-bold tracking-wide capitalize">...</h3>
                    <p class="text-[10px] uppercase font-bold tracking-widest text-zinc-500 mt-1">Кликни на день, чтобы перейти к нему</p>
                </div>
                <div class="grid grid-cols-7 gap-1 md:gap-3 text-center mb-2">
                    <div class="text-[9px] uppercase tracking-widest font-bold text-zinc-500">Пн</div>
                    <div class="text-[9px] uppercase tracking-widest font-bold text-zinc-500">Вт</div>
                    <div class="text-[9px] uppercase tracking-widest font-bold text-zinc-500">Ср</div>
                    <div class="text-[9px] uppercase tracking-widest font-bold text-zinc-500">Чт</div>
                    <div class="text-[9px] uppercase tracking-widest font-bold text-zinc-500">Пт</div>
                    <div class="text-[9px] uppercase tracking-widest font-bold text-zinc-500">Сб</div>
                    <div class="text-[9px] uppercase tracking-widest font-bold text-rose-500/70">Вс</div>
                </div>
                <!-- Сетка генерируется через JS -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 md:gap-3"></div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://sdxclbfwetgadcsvyyom.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkeGNsYmZ3ZXRnYWRjc3Z5eW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDg4NDAsImV4cCI6MjA5NDQyNDg0MH0.zil5m_Q6caiD3QpQDn6tS_WxSoqJmHCQEojyD1FbgZA';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let logs = [];
        let chart1, chart2, chart3;
        let selectedDate = new Date();
        
        let currentChartIdx = 0;
        const chartTitles = ['Активность за день (часы)', 'Соотношение за день', 'Статистика за месяц (дни)'];

        let currentTab = 'dash';

        function setSync(show) {
            document.getElementById('sync-status').style.opacity = show ? "1" : "0";
        }

        // --- УПРАВЛЕНИЕ ВКЛАДКАМИ ---
        function setTab(tab) {
            currentTab = tab;
            const btnDash = document.getElementById('tab-btn-dash');
            const btnCal = document.getElementById('tab-btn-cal');
            
            if(tab === 'dash') {
                document.getElementById('view-dash').classList.remove('hidden');
                document.getElementById('view-cal').classList.add('hidden');
                document.getElementById('dash-balances').classList.remove('opacity-0', 'pointer-events-none');
                
                btnDash.className = "px-6 py-2.5 rounded-full bg-zinc-800 text-white text-[10px] font-bold uppercase tracking-widest transition-all shadow-md cursor-pointer";
                btnCal.className = "px-6 py-2.5 rounded-full bg-transparent border border-zinc-800/60 text-zinc-500 hover:text-white hover:bg-zinc-800/30 text-[10px] font-bold uppercase tracking-widest transition-all cursor-pointer";
            } else {
                document.getElementById('view-dash').classList.add('hidden');
                document.getElementById('view-cal').classList.remove('hidden');
                document.getElementById('dash-balances').classList.add('opacity-0', 'pointer-events-none');
                
                btnCal.className = "px-6 py-2.5 rounded-full bg-zinc-800 text-white text-[10px] font-bold uppercase tracking-widest transition-all shadow-md cursor-pointer";
                btnDash.className = "px-6 py-2.5 rounded-full bg-transparent border border-zinc-800/60 text-zinc-500 hover:text-white hover:bg-zinc-800/30 text-[10px] font-bold uppercase tracking-widest transition-all cursor-pointer";
                
                renderCalendar();
            }
        }

        async function loadData() {
            setSync(true);
            const { data, error } = await db.from('transactions').select('*');
            if (!error && data) {
                logs = data;
                updateUI();
            } else if (error) {
                console.error("Ошибка Supabase:", error);
            }
            setSync(false);
        }

        async function addData(type) {
            const id = type === 'in' ? 'qty-in' : 'qty-out';
            const input = document.getElementById(id);
            const val = parseInt(input.value);
            
            if (isNaN(val) || val <= 0) {
                input.value = '';
                return;
            }

            const entry = {
                id: Date.now().toString(),
                type: type,
                amount: val,
                time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}),
                hour: new Date().getHours(),
                date: selectedDate.toLocaleDateString('ru-RU')
            };

            logs.push(entry);
            input.value = '';
            updateUI();

            setSync(true);
            await db.from('transactions').insert([entry]);
            setSync(false);
        }

        async function remove(id) {
            logs = logs.filter(l => l.id != id);
            updateUI();
            setSync(true);
            await db.from('transactions').delete().eq('id', id);
            setSync(false);
        }

        function changeChart(dir) {
            currentChartIdx = (currentChartIdx + dir + 3) % 3;
            document.getElementById('chart-title-text').innerText = chartTitles[currentChartIdx];
            
            for (let i = 0; i < 3; i++) {
                const canvas = document.getElementById(`activityChart${i+1}`);
                const dot = document.getElementById(`dot${i}`);
                
                if (i === currentChartIdx) {
                    canvas.classList.remove('opacity-0', 'pointer-events-none', 'z-0');
                    canvas.classList.add('opacity-100', 'z-10');
                    dot.classList.replace('bg-zinc-700', 'bg-blue-500');
                } else {
                    canvas.classList.remove('opacity-100', 'z-10');
                    canvas.classList.add('opacity-0', 'pointer-events-none', 'z-0');
                    dot.classList.replace('bg-blue-500', 'bg-zinc-700');
                }
            }
        }

        function updateUI() {
            const dateStr = selectedDate.toLocaleDateString('ru-RU');
            const isToday = dateStr === new Date().toLocaleDateString('ru-RU');
            document.getElementById('current-date-title').innerText = selectedDate.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}) + (isToday ? ' (Сегодня)' : '');
            
            const filtered = logs.filter(l => l.date === dateStr);
            
            const sumIn = filtered.filter(l => l.type === 'in').reduce((a,b) => a + b.amount, 0);
            const sumOut = filtered.filter(l => l.type === 'out').reduce((a,b) => a + b.amount, 0);
            
            document.getElementById('total-in').innerHTML = `${sumIn} <span class="text-sm font-medium text-zinc-500">шт.</span>`;
            document.getElementById('total-out').innerHTML = `${sumOut} <span class="text-sm font-medium text-zinc-500">шт.</span>`;

            const logEl = document.getElementById('log');
            logEl.innerHTML = filtered.length ? [...filtered].reverse().map(l => {
                const isOut = l.type === 'out';
                const textColor = isOut ? 'text-white' : 'text-white';
                const labelColor = isOut ? 'text-rose-400' : 'text-blue-400';
                const label = isOut ? 'Поверка' : 'Новые';
                
                return `
                <div class="flex justify-between items-center px-4 py-3 rounded-xl border border-zinc-800/60 bg-zinc-900/30 hover:bg-zinc-800/50 transition-colors group">
                    <div class="flex items-center gap-4">
                        <span class="text-[11px] font-medium text-zinc-500 w-10">${l.time}</span>
                        <span class="text-[10px] uppercase tracking-wider font-bold ${labelColor}">${label}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-base ${textColor}">+${l.amount} <span class="text-xs font-normal text-zinc-500">шт.</span></span>
                        <button onclick="remove('${l.id}')" class="text-zinc-600 hover:text-rose-500 cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
                    </div>
                </div>
            `}).join('') : '<p class="text-center text-zinc-600 text-sm py-6">Операций пока нет.</p>';

            if (chart1 && chart2 && chart3) {
                // График 1: Часы
                const hIn = Array(24).fill(0), hOut = Array(24).fill(0);
                filtered.forEach(l => l.type === 'in' ? hIn[l.hour] += l.amount : hOut[l.hour] += l.amount);
                chart1.data.datasets[0].data = hIn;
                chart1.data.datasets[1].data = hOut;
                chart1.update();

                // График 2: Пирог
                chart2.data.datasets[0].data = [sumIn, sumOut];
                chart2.update();

                // График 3: Столбцы по месяцу
                const monthYear = dateStr.substring(3); 
                const daysInMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth() + 1, 0).getDate();
                const monthlyLogs = logs.filter(l => l.date && l.date.endsWith(monthYear));
                
                const mIn = Array(daysInMonth).fill(0);
                const mOut = Array(daysInMonth).fill(0);
                
                monthlyLogs.forEach(l => {
                    const day = parseInt(l.date.substring(0, 2), 10);
                    if (day >= 1 && day <= daysInMonth) {
                        if (l.type === 'in') mIn[day - 1] += l.amount;
                        if (l.type === 'out') mOut[day - 1] += l.amount;
                    }
                });

                chart3.data.labels = Array.from({length: daysInMonth}, (_, i) => i + 1);
                chart3.data.datasets[0].data = mIn;
                chart3.data.datasets[1].data = mOut;
                chart3.update();
            }

            // Если открыт календарь — обновляем и его тоже
            if (currentTab === 'cal') renderCalendar();
        }

        // --- РЕНДЕР КАЛЕНДАРЯ ---
        function renderCalendar() {
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Определяем первый день месяца (смещаем под Пн = 0)
            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; 

            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            document.getElementById('calendar-month-title').innerText = `${monthNames[month]} ${year}`;

            const grid = document.getElementById('calendar-grid');
            let html = '';

            // Пустые ячейки для выравнивания начала месяца
            for(let i = 0; i < firstDay; i++) {
                html += `<div class="p-1 rounded-xl bg-zinc-900/10 border border-zinc-800/10 opacity-30"></div>`;
            }

            // Ячейки дней
            for(let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${String(d).padStart(2, '0')}.${String(month + 1).padStart(2, '0')}.${year}`;
                const dayLogs = logs.filter(l => l.date === dateStr);
                
                const sumIn = dayLogs.filter(l => l.type === 'in').reduce((a, b) => a + b.amount, 0);
                const sumOut = dayLogs.filter(l => l.type === 'out').reduce((a, b) => a + b.amount, 0);
                
                const isSelected = dateStr === selectedDate.toLocaleDateString('ru-RU');
                const isToday = dateStr === new Date().toLocaleDateString('ru-RU');
                
                let borderClass = 'border-zinc-800/60';
                let bgClass = 'bg-zinc-900/30 hover:bg-zinc-800/60 hover:border-zinc-600';
                
                if (isSelected) {
                    borderClass = 'border-blue-500/50';
                    bgClass = 'bg-blue-500/10';
                } else if (isToday) {
                    borderClass = 'border-zinc-400';
                }

                html += `
                <div onclick="goToSpecificDate(${d})" class="p-1.5 md:p-2 rounded-xl border ${borderClass} ${bgClass} flex flex-col items-center justify-start min-h-[60px] md:min-h-[85px] transition-colors cursor-pointer group">
                    <span class="text-[10px] md:text-xs font-bold ${isSelected ? 'text-white' : 'text-zinc-400 group-hover:text-zinc-300'} mb-1">${d}</span>
                    <div class="flex flex-col gap-[2px] items-center w-full">
                        ${sumIn > 0 ? `<span class="text-[9px] md:text-[11px] font-bold text-blue-400 leading-none">+${sumIn}<span class="text-[7px] text-zinc-500 font-normal ml-[1px]">шт.</span></span>` : ''}
                        ${sumOut > 0 ? `<span class="text-[9px] md:text-[11px] font-bold text-rose-400 leading-none">-${sumOut}<span class="text-[7px] text-zinc-500 font-normal ml-[1px]">шт.</span></span>` : ''}
                    </div>
                </div>
                `;
            }
            grid.innerHTML = html;
        }

        // Переход из Календаря в выбранный день на Дашборде
        function goToSpecificDate(day) {
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            selectedDate = new Date(year, month, day);
            updateUI();
            setTab('dash');
        }

        function changeDay(o) { selectedDate.setDate(selectedDate.getDate() + o); updateUI(); }
        function goToToday() { selectedDate = new Date(); updateUI(); }

        function init() {
            Chart.defaults.color = '#71717a';
            Chart.defaults.font.family = 'Inter';
            
            const tooltipConfig = { backgroundColor: '#18181b', titleColor: '#fff', bodyColor: '#a1a1aa', padding: 12, borderColor: '#27272a', borderWidth: 1, cornerRadius: 8 };

            const ctx1 = document.getElementById('activityChart1').getContext('2d');
            chart1 = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [
                        { label: 'Новые (шт.)', data: [], borderColor: '#3b82f6', borderWidth: 2, tension: 0.4, pointRadius: 0, pointHoverRadius: 6, pointBackgroundColor: '#3b82f6' },
                        { label: 'Поверка (шт.)', data: [], borderColor: '#f43f5e', borderWidth: 2, tension: 0.4, pointRadius: 0, pointHoverRadius: 6, pointBackgroundColor: '#f43f5e' }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false }, tooltip: tooltipConfig }, 
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#27272a', drawBorder: false }, border: { dash: [4, 4] } }, 
                        x: { grid: { display: false, drawBorder: false } } 
                    } 
                }
            });

            const ctx2 = document.getElementById('activityChart2').getContext('2d');
            chart2 = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Новые', 'Поверка'],
                    datasets: [{ data: [0, 0], backgroundColor: ['#3b82f6', '#f43f5e'], borderWidth: 0, hoverOffset: 4 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '70%',
                    plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', padding: 20, usePointStyle: true } }, tooltip: tooltipConfig }
                }
            });

            const ctx3 = document.getElementById('activityChart3').getContext('2d');
            chart3 = new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: [], 
                    datasets: [
                        { label: 'Новые (шт.)', data: [], backgroundColor: '#3b82f6', borderRadius: 4 },
                        { label: 'Поверка (шт.)', data: [], backgroundColor: '#f43f5e', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false }, tooltip: tooltipConfig }, 
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#27272a', drawBorder: false }, border: { dash: [4, 4] }, stacked: false }, 
                        x: { 
                            grid: { display: false, drawBorder: false }, 
                            stacked: false,
                            ticks: {
                                autoSkip: false, // ИСПРАВЛЕНИЕ: Жестко заставляем показывать каждый день!
                                maxRotation: 45, // Слегка поворачиваем цифры, чтобы они точно влезли
                                font: { size: 10 }
                            }
                        } 
                    }
                }
            });
            
            document.getElementById('btn-in').onclick = () => addData('in');
            document.getElementById('btn-out').onclick = () => addData('out');
            
            document.getElementById('qty-in').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') addData('in');
            });
            document.getElementById('qty-out').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') addData('out');
            });
            
            updateUI();
            loadData();
        }

        async function clearDay() {
            if(!confirm('Безвозвратно удалить все записи за этот день?')) return;
            const dateStr = selectedDate.toLocaleDateString('ru-RU');
            const toDelete = logs.filter(l => l.date === dateStr);
            logs = logs.filter(l => l.date !== dateStr);
            updateUI();
            for(let l of toDelete) await db.from('transactions').delete().eq('id', l.id);
        }

        function downloadCSV() {
            const dateStr = selectedDate.toLocaleDateString('ru-RU');
            const filtered = logs.filter(l => l.date === dateStr);
            if (filtered.length === 0) return alert('В этот день нечего выгружать.');
            
            let csv = "\uFEFFДата,Время,Тип операции,Количество\n";
            filtered.forEach(l => { 
                const typeStr = l.type === 'out' ? 'Поверка' : 'Новые';
                csv += `${l.date},${l.time},${typeStr},${l.amount} шт.\n`; 
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `otchet_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = init;
    </script>
</body>
</html>
