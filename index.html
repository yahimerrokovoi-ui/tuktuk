<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tracker Cloud (Supabase)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <div id="sync-status" class="h-4 mb-4 text-xs font-bold uppercase tracking-widest text-center text-emerald-400 transition-opacity duration-300 opacity-0">
            Синхронизация...
        </div>

        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <button onclick="changeDay(-1)" class="p-3 bg-slate-800 rounded-xl hover:bg-slate-700 text-slate-400">◀</button>
                <div class="text-center min-w-[140px]">
                    <p onclick="goToToday()" class="text-slate-400 text-[10px] uppercase tracking-widest font-bold cursor-pointer">Отчет за</p>
                    <h1 id="current-date-title" class="text-lg font-bold text-white whitespace-nowrap">...</h1>
                </div>
                <button onclick="changeDay(1)" class="p-3 bg-slate-800 rounded-xl hover:bg-slate-700 text-slate-400">▶</button>
            </div>
            
            <div class="flex gap-2">
                <div class="text-right bg-blue-500/10 px-3 py-2 rounded-2xl border border-blue-500/20">
                    <div class="text-[9px] uppercase text-blue-400 font-bold">Забрано</div>
                    <div id="total-in" class="text-2xl font-black text-blue-400">0</div>
                </div>
                <div class="text-right bg-red-500/10 px-3 py-2 rounded-2xl border border-red-500/20">
                    <div class="text-[9px] uppercase text-red-400 font-bold">Отправка</div>
                    <div id="total-out" class="text-2xl font-black text-red-400">0</div>
                </div>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 mb-4 border-l-4 border-l-blue-500">
            <div class="flex gap-4">
                <input type="number" id="qty-in" placeholder="Сколько ЗАБРАЛ?" 
                    class="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 w-full outline-none text-white">
                <button id="btn-in" class="bg-blue-600 px-8 py-3 rounded-xl font-bold">OK</button>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 mb-8 border-l-4 border-l-red-500">
            <div class="flex gap-4">
                <input type="number" id="qty-out" placeholder="На ОТПРАВКУ?" 
                    class="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 w-full outline-none text-white">
                <button id="btn-out" class="bg-red-600 px-8 py-3 rounded-xl font-bold">OK</button>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 mb-8">
            <canvas id="activityChart"></canvas>
        </div>

        <div class="glass rounded-2xl p-6 mb-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h3 class="text-slate-400 uppercase text-xs font-bold tracking-widest">Лог событий</h3>
                <button onclick="downloadCSV()" class="text-xs text-slate-400 font-medium">CSV</button>
            </div>
            <div id="log" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
        </div>

        <div class="text-center">
            <button onclick="clearDay()" class="text-slate-600 text-[10px] uppercase font-bold hover:text-red-500">Очистить день</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sdxclbfwetgadcsvyyom.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkeGNsYmZ3ZXRnYWRjc3Z5eW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDg4NDAsImV4cCI6MjA5NDQyNDg0MH0.zil5m_Q6caiD3QpQDn6tS_WxSoqJmHCQEojyD1FbgZA';
        
        // ИЗМЕНЕНО: теперь переменная называется db, конфликта нет
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let logs = [];
        let chart;
        let selectedDate = new Date();

        function setSync(show) {
            document.getElementById('sync-status').style.opacity = show ? "1" : "0";
        }

        async function loadData() {
            setSync(true);
            const { data, error } = await db.from('transactions').select('*');
            if (!error && data) {
                logs = data;
                updateUI();
            } else if (error) {
                console.error("Ошибка Supabase:", error);
            }
            setSync(false);
        }

        async function addData(type) {
            const id = type === 'in' ? 'qty-in' : 'qty-out';
            const input = document.getElementById(id);
            const val = parseInt(input.value);
            if (isNaN(val) || val <= 0) return;

            const entry = {
                id: Date.now().toString(),
                type: type,
                amount: val,
                time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}),
                hour: new Date().getHours(),
                date: selectedDate.toLocaleDateString('ru-RU')
            };

            logs.push(entry);
            input.value = '';
            updateUI();

            setSync(true);
            await db.from('transactions').insert([entry]);
            setSync(false);
        }

        async function remove(id) {
            logs = logs.filter(l => l.id != id);
            updateUI();
            setSync(true);
            await db.from('transactions').delete().eq('id', id);
            setSync(false);
        }

        function updateUI() {
            const dateStr = selectedDate.toLocaleDateString('ru-RU');
            const isToday = dateStr === new Date().toLocaleDateString('ru-RU');
            document.getElementById('current-date-title').innerText = selectedDate.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}) + (isToday ? ' (Сегодня)' : '');
            
            const filtered = logs.filter(l => l.date === dateStr);
            
            const sumIn = filtered.filter(l => l.type === 'in').reduce((a,b) => a + b.amount, 0);
            const sumOut = filtered.filter(l => l.type === 'out').reduce((a,b) => a + b.amount, 0);
            
            document.getElementById('total-in').innerText = sumIn;
            document.getElementById('total-out').innerText = sumOut;

            const logEl = document.getElementById('log');
            logEl.innerHTML = filtered.length ? [...filtered].reverse().map(l => `
                <div class="flex justify-between items-center p-3 rounded-lg border border-slate-800 ${l.type === 'out' ? 'bg-red-500/5' : 'bg-blue-500/5'}">
                    <span class="text-xs text-slate-500">${l.time}</span>
                    <span class="font-bold ${l.type === 'out' ? 'text-red-400' : 'text-blue-400'}">+${l.amount}</span>
                    <button onclick="remove('${l.id}')" class="text-slate-700 hover:text-red-500">✕</button>
                </div>
            `).join('') : '<p class="text-center text-slate-700 py-4">Нет записей</p>';

            if (chart) {
                const hIn = Array(24).fill(0), hOut = Array(24).fill(0);
                filtered.forEach(l => l.type === 'in' ? hIn[l.hour] += l.amount : hOut[l.hour] += l.amount);
                chart.data.datasets[0].data = hIn;
                chart.data.datasets[1].data = hOut;
                chart.update();
            }
        }

        function changeDay(o) { selectedDate.setDate(selectedDate.getDate() + o); updateUI(); }
        function goToToday() { selectedDate = new Date(); updateUI(); }

        function init() {
            const ctx = document.getElementById('activityChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [
                        { label: 'Вход', data: [], borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.05)' },
                        { label: 'Выход', data: [], borderColor: '#ef4444', tension: 0.4, fill: true, backgroundColor: 'rgba(239, 68, 68, 0.05)' }
                    ]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#1e293b' } }, x: { grid: { display: false } } } }
            });
            
            document.getElementById('btn-in').onclick = () => addData('in');
            document.getElementById('btn-out').onclick = () => addData('out');
            document.getElementById('qty-in').onkeydown = e => e.key === 'Enter' && addData('in');
            document.getElementById('qty-out').onkeydown = e => e.key === 'Enter' && addData('out');
            
            updateUI();
            loadData();
        }

        async function clearDay() {
            if(!confirm('Удалить всё за этот день?')) return;
            const dateStr = selectedDate.toLocaleDateString('ru-RU');
            const toDelete = logs.filter(l => l.date === dateStr);
            logs = logs.filter(l => l.date !== dateStr);
            updateUI();
            for(let l of toDelete) await db.from('transactions').delete().eq('id', l.id);
        }

        window.onload = init;
    </script>
</body>
</html>
