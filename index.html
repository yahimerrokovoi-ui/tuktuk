<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <p class="text-slate-400 text-sm uppercase tracking-widest font-bold">Отчет за</p>
                <h1 id="current-date-title" class="text-2xl font-bold tracking-tight text-white underline decoration-blue-500">...</h1>
            </div>
            <div id="total-count" class="text-4xl font-black text-blue-400 bg-blue-400/10 px-4 py-2 rounded-2xl">0</div>
        </div>

        <div class="glass rounded-2xl p-6 mb-8">
            <div class="flex gap-4">
                <input type="number" id="quantity" placeholder="Введите число..." autocomplete="off"
                    class="bg-slate-800 border-none rounded-xl px-4 py-3 w-full focus:ring-2 focus:ring-blue-500 outline-none text-lg text-white">
                <button id="add-btn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all px-8 py-3 rounded-xl font-bold shadow-lg shadow-blue-500/20">
                    OK
                </button>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 mb-8">
            <canvas id="activityChart"></canvas>
        </div>

        <div class="glass rounded-2xl p-6 mb-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h3 class="text-slate-400 uppercase text-xs font-bold tracking-widest">Лог событий</h3>
                <button onclick="downloadCSV()" class="text-xs text-blue-400 hover:text-blue-300 font-medium">Экспорт в CSV</button>
            </div>
            <div id="log" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
        </div>
        
        <div class="flex gap-4 justify-center">
            <button onclick="clearData()" class="text-slate-500 text-xs hover:text-red-400 transition-colors uppercase tracking-widest">Очистить данные за сегодня</button>
        </div>
    </div>

    <script>
        let logs = JSON.parse(localStorage.getItem('dailyLogs')) || [];
        let chart;

        // ПОЛНАЯ ДАТА: Число, месяц (словом), год
        const todayStr = new Date().toLocaleDateString('ru-RU', { 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric' 
        });
        document.getElementById('current-date-title').innerText = todayStr;

        function initChart() {
            const ctx = document.getElementById('activityChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [{
                        label: 'Количество',
                        data: Array(24).fill(0),
                        borderColor: '#60a5fa',
                        borderWidth: 3,
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: '#60a5fa'
                    }]
                },
                options: { 
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }, 
                        x: { grid: { display: false }, ticks: { color: '#64748b' } } 
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // Исправленный ввод по клику и Enter
            document.getElementById('add-btn').onclick = addData;
            document.getElementById('quantity').onkeydown = (e) => { 
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addData(); 
                }
            };

            updateUI();
        }

        function addData() {
            const input = document.getElementById('quantity');
            const val = input.value.trim();
            const qty = parseInt(val);
            
            if (isNaN(qty) || qty <= 0) return;

            const now = new Date();
            const entry = {
                id: Date.now(),
                amount: qty,
                time: now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                hour: now.getHours(),
                date: now.toLocaleDateString('ru-RU')
            };

            logs.push(entry);
            localStorage.setItem('dailyLogs', JSON.stringify(logs));
            input.value = '';
            updateUI();
        }

        function updateUI() {
            const today = new Date().toLocaleDateString('ru-RU');
            const todayLogs = logs.filter(l => l.date === today);
            
            const total = todayLogs.reduce((sum, l) => sum + l.amount, 0);
            document.getElementById('total-count').innerText = total;

            const logContainer = document.getElementById('log');
            if (todayLogs.length === 0) {
                logContainer.innerHTML = '<p class="text-slate-600 text-center text-sm py-4">Сегодня записей еще нет</p>';
            } else {
                logContainer.innerHTML = [...todayLogs].reverse().map(l => `
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-slate-400 text-sm">${l.time}</span>
                        <span class="font-bold text-blue-400">+${l.amount}</span>
                    </div>
                `).join('');
            }

            const hourlyData = Array(24).fill(0);
            todayLogs.forEach(l => hourlyData[l.hour] += l.amount);
            chart.data.datasets[0].data = hourlyData;
            chart.update();
        }

        function downloadCSV() {
            const today = new Date().toLocaleDateString('ru-RU');
            const todayLogs = logs.filter(l => l.date === today);
            if (todayLogs.length === 0) return alert('Нет данных для экспорта');
            
            let csv = "\uFEFFДата,Время,Количество\n";
            todayLogs.forEach(l => { csv += `${l.date},${l.time},${l.amount}\n`; });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `otchet_${today}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearData() {
            if(confirm('Вы уверены, что хотите удалить все записи за сегодня?')) {
                const today = new Date().toLocaleDateString('ru-RU');
                logs = logs.filter(l => l.date !== today);
                localStorage.setItem('dailyLogs', JSON.stringify(logs));
                updateUI();
            }
        }

        initChart();
    </script>
</body>
</html>
